[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nc-vision-agent"
version = "0.0.1"
description = "Standalone RPG image classification agent (Qwen3-VL) for the Nexus Campaigns vault pipeline"
requires-python = ">=3.10"
dependencies = [
    "pyyaml",
    "pillow",
    "numpy",
    # Transitive: required by nexus.shared, copied into system/ at deploy
    # time - see install.py and requirements.txt for details.
    "anthropic>=0.40,<1",
    "pydantic>=2.7,<3",
    "ruamel.yaml>=0.18,<0.19",
    "filelock>=3.14,<4",
    "requests>=2.31,<3",
    "deepface>=0.0.93",
    "tf-keras>=2.16",
    "python-slugify>=8.0,<9",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
nc-vision-agent = "nc_vision_agent.tools.classify_images:cli"
nc-vision-agent-extract-text = "nc_vision_agent.tools.extract_text:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nc_vision_agent = ["prompts/*.txt", "prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short -q"
