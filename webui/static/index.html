<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nc-vision-agent</title>
<style>
  :root {
    color-scheme: light dark;
    --border: rgba(128,128,128,.3);
    --card-bg: rgba(128,128,128,.05);
    --accent: #4a7dff;
    --accent-bg: rgba(74,125,255,.12);
    --accent-border: rgba(74,125,255,.4);
    --danger: #e5484d;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, system-ui, "Segoe UI", sans-serif;
    max-width: 720px; margin: 0 auto; padding: 2.5rem 1.25rem 4rem;
    line-height: 1.5;
  }
  header { margin-bottom: 1.75rem; }
  h1 { font-size: 1.4rem; margin: 0 0 .2rem; }
  header p { margin: 0; opacity: .65; font-size: .92rem; }

  .card {
    border: 1px solid var(--border); border-radius: 12px;
    padding: 1.5rem; background: var(--card-bg); margin-bottom: 1.5rem;
  }
  .card h2 { font-size: 1rem; margin: 0 0 1rem; }

  .dropzone {
    display: block;
    border: 2px dashed var(--border); border-radius: 10px;
    padding: 2rem 1rem; text-align: center; cursor: pointer;
    transition: border-color .15s, background .15s;
    position: relative;
  }
  .dropzone:hover, .dropzone.drag { border-color: var(--accent); background: var(--accent-bg); }
  .dropzone input[type=file] {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; cursor: pointer;
  }
  .dropzone .hint { opacity: .6; font-size: .85rem; margin-top: .25rem; }
  .dropzone .icon { font-size: 1.8rem; margin-bottom: .4rem; }

  #preview-wrap { display: none; margin-top: 1rem; text-align: center; }
  #preview { max-width: 100%; max-height: 260px; border-radius: 8px; }
  #filename { display: block; margin-top: .5rem; font-size: .85rem; opacity: .75; word-break: break-all; }

  .actions { display: flex; align-items: center; gap: 1rem; margin-top: 1.25rem; }
  button {
    padding: 0.6rem 1.4rem; font-size: .95rem; font-weight: 600; cursor: pointer;
    border: none; border-radius: 8px; background: var(--accent); color: #fff;
    transition: opacity .15s;
  }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  button:not(:disabled):hover { opacity: .9; }

  .progress { flex: 1; height: 6px; border-radius: 4px; background: rgba(128,128,128,.25); overflow: hidden; display: none; }
  .progress > div { height: 100%; width: 35%; background: var(--accent); animation: slide 1.1s ease-in-out infinite; border-radius: 4px; }
  @keyframes slide { 0% { transform: translateX(-120%); } 100% { transform: translateX(385%); } }
  #status { min-height: 1.2em; opacity: .7; font-size: .85rem; margin: .6rem 0 0; }

  #result-card { display: none; }
  #result-card.show { display: block; }

  dl.fields { display: grid; grid-template-columns: auto 1fr; gap: .4rem 1rem; margin: 0 0 1rem; }
  dl.fields dt { font-weight: 600; opacity: .65; font-size: .82rem; text-transform: uppercase; letter-spacing: .02em; }
  dl.fields dd { margin: 0; }

  .description { margin: 0 0 1rem; }
  .tags { margin-bottom: .5rem; }
  .tag {
    display: inline-block; background: var(--accent-bg); border: 1px solid var(--accent-border);
    border-radius: 999px; padding: 0.15rem 0.65rem; margin: 0.15rem .25rem .15rem 0; font-size: 0.82rem;
  }

  details { margin-top: 1rem; }
  summary { cursor: pointer; font-size: .9rem; font-weight: 600; opacity: .8; }
  pre {
    white-space: pre-wrap; word-break: break-word; background: rgba(128,128,128,.1);
    padding: 0.75rem; border-radius: 8px; max-height: 420px; overflow: auto;
    font-size: .82rem; margin-top: .6rem;
  }

  .error { color: var(--danger); font-weight: 600; margin: 0 0 .5rem; }
  .action-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(205px, 1fr)); gap: .65rem; }
  .action-grid button { width: 100%; text-align: left; padding: .7rem .8rem; }
  .action-grid button small { display: block; font-weight: 400; opacity: .8; margin-top: .15rem; }
  .action-result { margin-top: 1rem; }
  .action-result h3 { font-size: .95rem; margin: 0 0 .45rem; }
</style>
</head>
<body>
<header>
  <h1>nc-vision-agent</h1>
  <p>Run every current vision-agent action from one local control panel.</p>
</header>

<form id="form">
  <div class="card">
    <h2>1. Upload</h2>
    <label class="dropzone" id="dropzone">
      <input type="file" id="file" accept="image/*" required>
      <div class="icon">🖼️</div>
      <div><strong>Click to choose</strong> or drag an image here</div>
      <div class="hint">PNG, JPG — portrait, body, token, battlemap, scene</div>
    </label>
    <div id="preview-wrap">
      <img id="preview" alt="preview">
      <span id="filename"></span>
    </div>
    <div class="actions">
      <button id="send" type="submit" disabled>Classify image</button>
      <div class="progress" id="progress"><div></div></div>
    </div>
    <p id="status"></p>
  </div>
</form>

<div class="card">
  <h2>2. Agent actions</h2>
  <p class="hint">Image actions use the selected upload above. Batch actions operate on the agent queue and drafts.</p>
  <div class="action-grid" id="action-grid">
    <button type="button" data-action="list_pending_images">List pending images<small>Inspect the classification queue</small></button>
    <button type="button" data-action="detect_token" data-needs-image>Detect token<small>Check transparent PNG corners</small></button>
    <button type="button" data-action="match_token_face" data-needs-image>Match token face<small>Find its portrait source</small></button>
    <button type="button" data-action="classify_image" data-needs-image>Classify image (preview)<small>Classify without renaming or drafting</small></button>
    <button type="button" data-action="run_classification_batch">Run classification batch<small>Classify pending images and write drafts</small></button>
    <button type="button" data-action="retry_failed">Retry failed classifications<small>Clear and retry failed image entries</small></button>
    <button type="button" data-action="extract_image_text" data-needs-image>Extract image text (preview)<small>OCR without changing a draft</small></button>
    <button type="button" data-action="run_text_extraction_batch">Run text extraction batch<small>OCR classified images and append notes</small></button>
    <button type="button" data-action="backfill_short_drafts">Backfill short drafts<small>Upgrade legacy draft bodies</small></button>
  </div>
  <div class="action-result" id="action-result" aria-live="polite"></div>
</div>

<div class="card" id="result-card">
  <h2>3. Classification result</h2>
  <div id="result"></div>
</div>

<script>
const form = document.getElementById('form');
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('file');
const previewWrap = document.getElementById('preview-wrap');
const preview = document.getElementById('preview');
const filenameEl = document.getElementById('filename');
const progress = document.getElementById('progress');
const status = document.getElementById('status');
const sendBtn = document.getElementById('send');
const resultCard = document.getElementById('result-card');
const result = document.getElementById('result');
const actionGrid = document.getElementById('action-grid');
const actionResult = document.getElementById('action-result');

function setFile(file) {
  if (!file) return;
  fileInput.files = (() => {
    const dt = new DataTransfer();
    dt.items.add(file);
    return dt.files;
  })();
  preview.src = URL.createObjectURL(file);
  filenameEl.textContent = file.name;
  previewWrap.style.display = 'block';
  sendBtn.disabled = false;
}

fileInput.addEventListener('change', () => setFile(fileInput.files[0]));

['dragenter', 'dragover'].forEach(evt =>
  dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.add('drag'); }));
['dragleave', 'drop'].forEach(evt =>
  dropzone.addEventListener(evt, e => { e.preventDefault(); dropzone.classList.remove('drag'); }));
dropzone.addEventListener('drop', e => {
  const file = e.dataTransfer.files[0];
  if (file) setFile(file);
});

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(',')[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function requestAction(action) {
  const button = actionGrid.querySelector(`[data-action="${action}"]`);
  const needsImage = button.hasAttribute('data-needs-image');
  const file = fileInput.files[0];
  if (needsImage && !file) {
    actionResult.innerHTML = '<p class="error">Choose an image first.</p>';
    return;
  }

  const buttons = actionGrid.querySelectorAll('button');
  buttons.forEach(b => b.disabled = true);
  actionResult.innerHTML = '<p id="action-status">Running action…</p>';
  try {
    const body = { action };
    if (needsImage) {
      body.filename = file.name;
      body.data = await fileToBase64(file);
    }
    const response = await fetch('/api/actions', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    });
    const payload = await response.json();
    const title = escapeHtml(payload.label || action);
    const where = payload.imagePath ? `<p>Image: ${escapeHtml(payload.imagePath)}</p>` : '';
    actionResult.innerHTML = payload.ok
      ? `<h3>${title}</h3>${where}<pre>${escapeHtml(payload.output)}</pre>`
      : `<h3>${title}</h3><p class="error">${escapeHtml(payload.error || payload.output || 'Action failed.')}</p>` +
        (payload.output ? `<pre>${escapeHtml(payload.output)}</pre>` : '');
  } catch (err) {
    actionResult.innerHTML = `<p class="error">Request failed: ${escapeHtml(err.message)}</p>`;
  } finally {
    buttons.forEach(b => b.disabled = false);
  }
}

actionGrid.addEventListener('click', e => {
  const button = e.target.closest('button[data-action]');
  if (button) requestAction(button.dataset.action);
});

function escapeHtml(s) {
  return (s ?? '').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const file = fileInput.files[0];
  if (!file) return;

  sendBtn.disabled = true;
  progress.style.display = 'block';
  status.textContent = 'Uploading and running agent — this can take a minute...';
  resultCard.classList.remove('show');
  result.innerHTML = '';

  try {
    const data = await fileToBase64(file);
    const res = await fetch('/api/classify', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ filename: file.name, data }),
    });
    render(await res.json());
  } catch (err) {
    render({ ok: false, error: `Request failed: ${err.message}` });
  } finally {
    sendBtn.disabled = false;
    progress.style.display = 'none';
    status.textContent = '';
  }
});

function render(r) {
  if (!r.ok) {
    result.innerHTML = `<p class="error">${escapeHtml(r.error)}</p>` +
      (r.log ? `<details open><summary>Agent log</summary><pre>${escapeHtml(r.log)}</pre></details>` : '');
  } else {
    const tags = (r.tags || []).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join(' ');
    result.innerHTML = `
      <dl class="fields">
        <dt>Container</dt><dd>${escapeHtml(r.container)}</dd>
        <dt>Image type</dt><dd>${escapeHtml(r.type)}</dd>
        <dt>Entity type</dt><dd>${escapeHtml(r.entity_type)}</dd>
        <dt>Ancestry</dt><dd>${escapeHtml(r.ancestry)}</dd>
        <dt>Class</dt><dd>${escapeHtml(r.class)}</dd>
        <dt>Creature type</dt><dd>${escapeHtml(r.creature_type)}</dd>
        <dt>Element</dt><dd>${escapeHtml(r.element)}</dd>
        <dt>Environment</dt><dd>${escapeHtml(r.environment)}</dd>
        <dt>Renamed to</dt><dd>${escapeHtml(r.renamedTo)}</dd>
      </dl>
      <p class="description">${escapeHtml(r.description)}</p>
      <div class="tags">${tags}</div>
      ${r.draft ? `<details><summary>Draft note — ${escapeHtml(r.draftName)}</summary><pre>${escapeHtml(r.draft)}</pre></details>` : ''}
    `;
  }
  resultCard.classList.add('show');
  resultCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
</script>
</body>
</html>
